<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Reporte Sismo - Dataknow</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #22c55e;
    --accent-h: #16a34a;
    --danger: #ef4444;
    --warn: #f59e0b;
    --border: #475569;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  header { text-align: center; margin-bottom: 24px; }
  header h1 { margin: 8px 0 4px; font-size: 24px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  label { display: block; margin: 12px 0 6px; font-size: 14px; color: var(--muted); }
  input[type=text], input[type=password], select, textarea {
    width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); font-size: 15px; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  textarea { min-height: 80px; resize: vertical; }
  .btn { display: inline-block; width: 100%; padding: 14px; border: 0; border-radius: 8px;
         background: var(--accent); color: #0b1220; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 12px; }
  .btn:hover { background: var(--accent-h); }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .btn.secondary { background: var(--panel-2); color: var(--text); }
  .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .status-grid label {
    display: flex; align-items: flex-start; gap: 8px; padding: 12px; border: 1px solid var(--border);
    border-radius: 8px; cursor: pointer; margin: 0; color: var(--text); font-size: 14px;
    background: var(--panel-2);
  }
  .status-grid label:has(input:checked) { border-color: var(--accent); background: rgba(34,197,94,.12); }
  .status-grid input { margin-top: 2px; }
  .banner-ok { background: rgba(34,197,94,.15); border: 1px solid var(--accent); color: #bbf7d0; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
  .banner-err { background: rgba(239,68,68,.15); border: 1px solid var(--danger); color: #fecaca; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
  .banner-warn { background: rgba(245,158,11,.12); border: 1px solid var(--warn); color: #fde68a; padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; }
  .country-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .country-tabs button {
    flex: 1; padding: 10px; border: 1px solid var(--border); background: var(--panel-2);
    color: var(--text); border-radius: 8px; cursor: pointer; font-weight: 600;
  }
  .country-tabs button.active { background: var(--accent); color: #0b1220; border-color: var(--accent); }
  .summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .summary .cell { background: var(--panel-2); border-radius: 8px; padding: 12px; text-align: center; }
  .summary .cell .n { font-size: 22px; font-weight: 700; }
  .summary .cell .l { font-size: 12px; color: var(--muted); }
  .prior { background: rgba(59,130,246,.12); border: 1px solid #3b82f6; color: #bfdbfe; padding: 10px 12px; border-radius: 8px; margin-top: 8px; font-size: 13px; }
  .suggest { position: relative; margin-top: 6px; }
  .suggest-list { position: absolute; left: 0; right: 0; top: 0; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; max-height: 260px; overflow-y: auto; z-index: 20; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .suggest-list .item { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 14px; }
  .suggest-list .item:last-child { border-bottom: 0; }
  .suggest-list .item:hover, .suggest-list .item.active { background: var(--accent); color: #0b1220; }
  .suggest-list .item small { color: var(--muted); display: block; font-size: 12px; margin-top: 2px; }
  .suggest-list .item.active small, .suggest-list .item:hover small { color: rgba(11,18,32,.7); }
  .chosen { background: rgba(34,197,94,.12); border: 1px solid var(--accent); padding: 10px 12px; border-radius: 8px; margin-top: 8px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .chosen button { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .empty { padding: 12px; color: var(--muted); font-size: 13px; }
  .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 20px; }
  a { color: #93c5fd; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Reporte de estado — Sismo</h1>
    <p>Dataknow · Reporta tu situación. Puedes actualizar cuantas veces necesites.</p>
  </header>

  <div id="app">
    <div id="okBanner" class="banner-ok" style="display:none">Reporte enviado. Gracias.</div>
    <div id="errBanner" class="banner-err" style="display:none"></div>

    <div class="card">
      <label>País</label>
      <div class="country-tabs" id="countryTabs"></div>

      <label for="empSearch">Escribe tu nombre</label>
      <input id="empSearch" type="text" placeholder="Ej: adr, jose, martinez..." autocomplete="off" spellcheck="false" />
      <div class="suggest"><div id="empList" class="suggest-list" style="display:none"></div></div>
      <div id="empChosen" class="chosen" style="display:none"></div>
      <div id="prior" class="prior" style="display:none"></div>
    </div>

    <div class="card">
      <label>¿Cómo estás? (marca todo lo que aplique)</label>
      <div class="status-grid" id="statusGrid">
        <label><input type="checkbox" value="Estoy bien" /> Estoy bien</label>
        <label><input type="checkbox" value="Herido leve" /> Estoy herido (leve)</label>
        <label><input type="checkbox" value="Requiero apoyo médico" /> Requiero apoyo médico</label>
        <label><input type="checkbox" value="Evacué el edificio" /> Evacué el edificio</label>
        <label><input type="checkbox" value="Sin luz" /> Sin luz</label>
        <label><input type="checkbox" value="Sin señal / internet" /> Sin señal / internet</label>
        <label><input type="checkbox" value="Sin agua" /> Sin agua</label>
        <label><input type="checkbox" value="Atendiendo familia" /> Atendiendo familia</label>
        <label><input type="checkbox" value="No puedo trabajar hoy" /> No puedo trabajar hoy</label>
        <label><input type="checkbox" value="Puedo trabajar" /> Puedo trabajar</label>
      </div>

      <label for="location">Ubicación actual</label>
      <select id="location">
        <option value="">-- Selecciona --</option>
        <option>Casa</option>
        <option>Oficina</option>
        <option>En tránsito</option>
        <option>Con familia</option>
        <option>Hospital / centro médico</option>
        <option>Otro</option>
      </select>

      <label for="city">Ciudad</label>
      <input id="city" type="text" placeholder="Ej: Bogotá, Ciudad de México, Quito..." />

      <label for="comments">Comentarios (opcional)</label>
      <textarea id="comments" placeholder="Contexto adicional, si necesitas algo puntual, etc."></textarea>

      <button class="btn" id="submitBtn">Enviar reporte</button>
      <button class="btn secondary" id="refreshBtn" style="margin-top:8px">Actualizar resumen</button>
    </div>

    <div class="card">
      <h3 style="margin:0 0 12px">Resumen actual <span id="sumCountry" style="color:var(--muted);font-weight:400;font-size:14px"></span></h3>
      <div class="summary" id="summary"><div class="cell"><div class="n">—</div><div class="l">Cargando</div></div></div>
      <p style="color:var(--muted);font-size:12px;margin:12px 0 0">
        Total esperado en país: <span id="totalCountry">—</span>. Reportados: <span id="totalReported">—</span>.
      </p>
    </div>

    <p class="foot">Los datos se guardan en un Google Sheet interno. Solo personal autorizado tiene acceso.</p>
  </div>

</div>

<script>
/* ============================================================
   CONFIG — Supabase
   ============================================================ */
const CONFIG = {
  SUPABASE_URL: "https://fpcvcobknolrqatxnoez.supabase.co",
  SUPABASE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZwY3Zjb2Jrbm9scnFhdHhub2V6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNTg5NTksImV4cCI6MjEwMTkzNDk1OX0.2JW_roL-MGCF2uf5Drb34GtebmJCWTOFjHWMcS6KqlQ",
  TABLE: "reportes"
};
/* ============================================================ */

function sbHeaders() {
  return {
    "apikey": CONFIG.SUPABASE_KEY,
    "Authorization": "Bearer " + CONFIG.SUPABASE_KEY,
    "Content-Type": "application/json"
  };
}

const COUNTRY_LABELS = { CO: "Colombia", MX: "México", EC: "Ecuador", PE: "Perú", OTRO: "Otro" };

let EMPLOYEES = [];
let currentCountry = "CO";
let priorReports = {}; // email -> latest report
let chosenEmail = "";
let activeIdx = -1;
let currentMatches = [];

function norm(s) {
  return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
}

bootstrap();

async function bootstrap() {
  try {
    const res = await fetch("employees.json", { cache: "no-store" });
    EMPLOYEES = await res.json();
  } catch (e) {
    showErr("No pude cargar la lista de empleados: " + e.message);
    return;
  }
  renderCountryTabs();
  selectCountry(guessCountry());
  await refreshSummary();
}

function guessCountry() {
  const p = new URLSearchParams(location.search).get("p");
  if (p && COUNTRY_LABELS[p.toUpperCase()]) return p.toUpperCase();
  // Timezone hint
  try {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
    if (tz.includes("Mexico")) return "MX";
    if (tz.includes("Guayaquil")) return "EC";
    if (tz.includes("Lima")) return "PE";
  } catch(_) {}
  return "CO";
}

function renderCountryTabs() {
  const tabs = document.getElementById("countryTabs");
  const counts = EMPLOYEES.reduce((a,e) => { a[e.p] = (a[e.p]||0)+1; return a; }, {});
  const order = ["CO","MX","EC","PE","OTRO"].filter(c => counts[c]);
  tabs.innerHTML = "";
  order.forEach(c => {
    const b = document.createElement("button");
    b.textContent = `${COUNTRY_LABELS[c]} (${counts[c]})`;
    b.dataset.c = c;
    b.addEventListener("click", () => selectCountry(c));
    tabs.appendChild(b);
  });
}

function selectCountry(c) {
  currentCountry = c;
  document.querySelectorAll("#countryTabs button").forEach(b => {
    b.classList.toggle("active", b.dataset.c === c);
  });
  clearEmployee();
  document.getElementById("sumCountry").textContent = "· " + COUNTRY_LABELS[c];
  refreshSummary();
}

function renderSuggestions() {
  const raw = document.getElementById("empSearch").value.trim();
  const listBox = document.getElementById("empList");
  if (!raw) { listBox.style.display = "none"; currentMatches = []; activeIdx = -1; return; }
  const tokens = norm(raw).split(/\s+/).filter(Boolean);
  const pool = EMPLOYEES.filter(e => e.p === currentCountry);
  currentMatches = pool.filter(e => {
    const hay = norm(e.n) + " " + norm(e.e);
    return tokens.every(t => hay.includes(t));
  }).slice(0, 30);
  activeIdx = currentMatches.length > 0 ? 0 : -1;
  drawList();
}

function drawList() {
  const listBox = document.getElementById("empList");
  if (currentMatches.length === 0) {
    listBox.style.display = "block";
    listBox.innerHTML = '<div class="empty">Sin coincidencias en ' + escapeHtml(COUNTRY_LABELS[currentCountry]) + '. ¿País correcto?</div>';
    return;
  }
  listBox.style.display = "block";
  listBox.innerHTML = "";
  currentMatches.forEach((e, i) => {
    const d = document.createElement("div");
    d.className = "item" + (i === activeIdx ? " active" : "");
    d.innerHTML = `${escapeHtml(e.n)}${e.a ? '<small>' + escapeHtml(e.a) + '</small>' : ''}`;
    d.addEventListener("mousedown", ev => { ev.preventDefault(); pickEmployee(e); });
    d.addEventListener("mouseenter", () => { activeIdx = i; drawList(); });
    listBox.appendChild(d);
  });
}

function pickEmployee(e) {
  chosenEmail = e.e;
  document.getElementById("empSearch").value = "";
  document.getElementById("empList").style.display = "none";
  const box = document.getElementById("empChosen");
  box.style.display = "flex";
  box.innerHTML = `<div><b>${escapeHtml(e.n)}</b>${e.a ? ' · <span style="color:var(--muted)">' + escapeHtml(e.a) + '</span>' : ''}</div><button type="button" id="empClear">Cambiar</button>`;
  document.getElementById("empClear").addEventListener("click", clearEmployee);
  showPrior();
}

function clearEmployee() {
  chosenEmail = "";
  document.getElementById("empChosen").style.display = "none";
  document.getElementById("prior").style.display = "none";
  document.getElementById("empSearch").value = "";
  document.getElementById("empSearch").focus();
}

function showPrior() {
  const prior = priorReports[chosenEmail];
  const box = document.getElementById("prior");
  if (!prior) { box.style.display = "none"; return; }
  box.style.display = "block";
  box.innerHTML = `Último reporte tuyo: <b>${escapeHtml(prior.status || "-")}</b> · ${escapeHtml(prior.location || "")} ${escapeHtml(prior.city || "")}<br><span style="color:var(--muted)">${escapeHtml(prior.timestamp || "")}</span>`;
}

const searchEl = document.getElementById("empSearch");
searchEl.addEventListener("input", renderSuggestions);
searchEl.addEventListener("focus", () => { if (searchEl.value.trim()) renderSuggestions(); });
searchEl.addEventListener("blur", () => { setTimeout(() => { document.getElementById("empList").style.display = "none"; }, 150); });
searchEl.addEventListener("keydown", (e) => {
  if (currentMatches.length === 0) return;
  if (e.key === "ArrowDown") { e.preventDefault(); activeIdx = (activeIdx + 1) % currentMatches.length; drawList(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); activeIdx = (activeIdx - 1 + currentMatches.length) % currentMatches.length; drawList(); }
  else if (e.key === "Enter") { e.preventDefault(); if (activeIdx >= 0) pickEmployee(currentMatches[activeIdx]); }
  else if (e.key === "Escape") { document.getElementById("empList").style.display = "none"; }
});

function escapeHtml(s) {
  return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

document.getElementById("submitBtn").addEventListener("click", submitReport);
document.getElementById("refreshBtn").addEventListener("click", refreshSummary);

async function submitReport() {
  hideBanners();
  const email = chosenEmail;
  if (!email) { showErr("Escribe y selecciona tu nombre primero."); return; }
  const emp = EMPLOYEES.find(e => e.e === email);
  const checked = Array.from(document.querySelectorAll("#statusGrid input:checked")).map(i => i.value);
  if (checked.length === 0) { showErr("Marca al menos una opción de estado."); return; }
  const payload = {
    email: email,
    name: emp ? emp.n : "",
    area: emp ? emp.a : "",
    country: emp ? emp.p : currentCountry,
    status: checked.join(", "),
    location: document.getElementById("location").value,
    city: document.getElementById("city").value.trim(),
    comments: document.getElementById("comments").value.trim(),
    timestamp: new Date().toISOString()
  };
  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "Enviando...";
  try {
    const r = await fetch(CONFIG.SUPABASE_URL + "/rest/v1/" + CONFIG.TABLE, {
      method: "POST",
      headers: { ...sbHeaders(), "Prefer": "return=minimal" },
      body: JSON.stringify(payload)
    });
    if (!r.ok) {
      const t = await r.text();
      throw new Error("HTTP " + r.status + ": " + t);
    }
    document.getElementById("okBanner").style.display = "block";
    document.querySelectorAll("#statusGrid input").forEach(i => i.checked = false);
    document.getElementById("comments").value = "";
    await refreshSummary();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (e) {
    showErr("No se pudo enviar: " + e.message);
  } finally {
    btn.disabled = false; btn.textContent = "Enviar reporte";
  }
}

async function refreshSummary() {
  const box = document.getElementById("summary");
  try {
    const url = CONFIG.SUPABASE_URL + "/rest/v1/" + CONFIG.TABLE
      + "?select=email,name,status,location,city,comments,timestamp,country"
      + "&country=eq." + encodeURIComponent(currentCountry)
      + "&order=timestamp.desc";
    const r = await fetch(url, { headers: sbHeaders(), cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const rows = await r.json();
    // Solo el reporte más reciente por email
    const latestByEmail = {};
    rows.forEach(row => {
      if (!latestByEmail[row.email]) latestByEmail[row.email] = row;
    });
    priorReports = latestByEmail;
    showPrior();
    const counts = {};
    Object.values(latestByEmail).forEach(r => {
      String(r.status || "").split(",").map(s => s.trim()).filter(Boolean).forEach(s => {
        counts[s] = (counts[s] || 0) + 1;
      });
    });
    const total = EMPLOYEES.filter(e => e.p === currentCountry).length;
    const reported = Object.keys(latestByEmail).length;
    document.getElementById("totalCountry").textContent = total;
    document.getElementById("totalReported").textContent = reported;
    box.innerHTML = "";
    const order = Object.keys(counts).sort((a,b) => counts[b] - counts[a]);
    if (order.length === 0) {
      box.innerHTML = '<div class="cell"><div class="n">0</div><div class="l">Sin reportes aún</div></div>';
      return;
    }
    order.forEach(k => {
      const d = document.createElement("div");
      d.className = "cell";
      d.innerHTML = `<div class="n">${counts[k]}</div><div class="l">${escapeHtml(k)}</div>`;
      box.appendChild(d);
    });
  } catch (e) {
    box.innerHTML = '<div class="cell"><div class="n">?</div><div class="l">No se pudo cargar: ' + escapeHtml(e.message) + '</div></div>';
  }
}

function showErr(msg) {
  const b = document.getElementById("errBanner");
  b.textContent = msg; b.style.display = "block";
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function hideBanners() {
  document.getElementById("okBanner").style.display = "none";
  document.getElementById("errBanner").style.display = "none";
}
</script>
</body>
</html>
